name: localgo
description: "LocalGo — city & local discovery app (offers, businesses, services, places)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Images
  cached_network_image: ^3.4.1

  # Platform integrations (calls, WhatsApp, maps)
  url_launcher: ^6.3.1

  # Location
  geolocator: ^13.0.3

  # Formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
